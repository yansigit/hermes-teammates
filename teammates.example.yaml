# hermes-subagents model roster. Copy it next to the profile's config.yaml (for example as subagents.yaml),
# then point the plugin at it:
#
#   plugins:
#     entries:
#       hermes-subagents:
#         settings:
#           roster_file: subagents.yaml     # relative to this profile's Hermes home, or an absolute path
#
# The file replaces the Models setting. Each entry is checked exactly like the setting; problems are listed by
# /subagents. Names: lowercase letters, digits, - or _, up to 32 characters. The agent picks an entry by name.
#
# Per entry (all optional):
#   model, route      (one of a configured Hermes provider's models, and that provider; set both, or neither to
#                      use your delegation settings or the parent's model)
#   description       (shown to your agent in subagent_spawn; say what the model is good and cheap at)
#   instructions      (a standing brief sent with every task, up to 4,000 characters)
#   toolsets          (narrows the parent's toolsets; leave out to inherit them)
#   reasoning_effort  (used where the Hermes build supports it; otherwise listed as unsupported)

models:
  haiku:
    model: claude-haiku-5-5
    route: anthropic
    description: Cheap and fast; file reading, summaries, small edits.
  sonnet:
    model: claude-sonnet-5-5
    route: anthropic
    description: Mid-tier; multi-file changes and reviews.
  opus:
    model: claude-opus-5-5
    route: anthropic
    description: Strongest and most expensive; hard design and debugging only.
